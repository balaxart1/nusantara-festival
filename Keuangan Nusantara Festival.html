<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keuangan Nusantara Festival</title>
<style>
:root{--bg:#faf3e3;--card:#fff;--tx:#1f3640;--mu:#6d7b80;--bd:#eadfc6;--in:#2b6a73;--out:#d71f36;--ac:#26414c;--inb:#e1eef0;--outb:#fde8eb;--invb:#f8f1c6;--inv:#8f6b00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121d22;--card:#1b2a31;--tx:#f3ecd9;--mu:#9fb0b5;--bd:#2c4048;--in:#6cc3c9;--out:#ff7a88;--ac:#a9812f;--inb:#15303a;--outb:#3a1a20;--invb:#2f2a0f;--inv:#e6c84f}}
:root[data-theme="dark"]{--bg:#121d22;--card:#1b2a31;--tx:#f3ecd9;--mu:#9fb0b5;--bd:#2c4048;--in:#6cc3c9;--out:#ff7a88;--ac:#a9812f;--inb:#15303a;--outb:#3a1a20;--invb:#2f2a0f;--inv:#e6c84f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:920px;margin:0 auto;padding:16px}
.hd{background:linear-gradient(135deg,#1f3640,#2f5262 55%,#c8a45f);color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:12px}
.hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.lg{background:#fff;border-radius:12px;padding:8px 12px;display:flex}.lg img{height:58px;width:auto;display:block}.hd h1{font-size:19px;margin:0}.hd .sub{opacity:.85;font-size:13px}
.hd .sd{font-size:12px;opacity:.9;margin-top:6px}.hd .sd:empty{display:none}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.c small{color:var(--mu);display:block;font-size:12px}.c b{font-size:18px}
.k{border:0}.k.in{background:var(--inb)}.k.in b{color:var(--in)}
.k.out{background:var(--outb)}.k.out b{color:var(--out)}
.k.inv{background:var(--invb)}.k.inv b{color:var(--inv)}
.k.big{grid-column:1/-1;background:linear-gradient(135deg,#26414c,#3f6a7a);color:#fff}.k.big small{color:#dbe8ec}.k.big b{font-size:28px;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.chip{font-size:12px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:3px 10px;display:flex;gap:6px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
input,select,button{font:inherit;width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{cursor:pointer;background:var(--ac);color:#fff;border:0;font-weight:600}
button.s{background:transparent;color:var(--mu);border:1px solid var(--bd);font-weight:400;width:auto;padding:6px 10px;font-size:13px}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.seg button.on.m{background:var(--in);color:#fff;border-color:var(--in)}
.seg button.on.k{background:var(--out);color:#fff;border-color:var(--out)}
.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.hint{font-size:12px;color:var(--mu);margin-top:6px;min-height:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 8px}.bar>*{flex:1;min-width:120px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mu);font-weight:600}td.n{text-align:right;white-space:nowrap;font-weight:700}
.in{color:var(--in)}.out{color:var(--out)}
.tag{font-size:12px;border-radius:6px;padding:2px 8px;white-space:nowrap;color:#fff}
.x{color:var(--mu);cursor:pointer;background:none;border:0;width:auto;padding:2px 6px}
.empty{text-align:center;color:var(--mu);padding:20px}
textarea{width:100%;height:120px;font-size:12px;display:none;margin-top:8px}
</style>
</head>

<div class="g">
<div class="c k big"><small>SALDO KAS</small><b id="saldo">Rp0</b></div>
<div class="c k in"><small>Total Masuk</small><b id="tin">Rp0</b></div>
<div class="c k out"><small>Total Keluar</small><b id="tout">Rp0</b></div>
</div>

<form id="fm" class="c" style="margin-top:10px">
<div class="seg">
<button type="button" id="bm" class="on m">+ Uang Masuk</button>
<button type="button" id="bk">– Uang Keluar</button>
</div>
<div class="f">
<div><label>Tanggal</label><input type="date" id="tgl" required></div>
<div style="grid-column:span 2"><label>Keterangan</label><input id="ket" required placeholder="mis. DP Tenant / Bayar Crew / Belanja Bahan"></div>
<div><label>Jumlah (Rp)</label><input id="jml" inputmode="numeric" placeholder="0" required></div>
<div><button type="submit">Simpan</button></div>
</div>
</form>

<div class="bar">
<select id="fb"></select>
<input id="fs" placeholder="Cari keterangan">
</div>
<div class="c tw" style="padding:4px 8px">
<table>
<thead><tr><th>Tanggal</th><th>Keterangan</th><th>Oleh</th><th style="text-align:right">Jumlah</th><th></th></tr></thead>
<tbody id="tb"></tbody>
</table>
</div>
<div class="bar"><button class="s" id="csv">Salin data (CSV)</button><button class="s" id="rst" style="display:none">Hapus semua data</button></div>
<textarea id="ta" readonly></textarea>
</div>

<script>
var D=[],tipe="m",KEY="nusantara_keuangan_v1",col=null,usr=null,uid=null,names={};
function $(i){return document.getElementById(i)}
function rp(n){return (n<0?"-":"")+"Rp"+Math.abs(n).toLocaleString("id-ID")}
function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function lsLoad(){try{D=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){D=[]}}
function lsSave(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function setTipe(t){tipe=t;$("bm").className=t=="m"?"on m":"";$("bk").className=t=="k"?"on k":""}
function render(){
 var im=0,ik=0;
 D.forEach(function(r){if(r.t=="m")im+=r.j;else ik+=r.j});
 $("saldo").textContent=rp(im-ik);
 $("tin").textContent=rp(im);$("tout").textContent=rp(ik);
 var fb=$("fb").value,q=$("fs").value.toLowerCase();
 var L=D.filter(function(r){return(!fb||r.d.slice(0,7)==fb)&&(!q||((r.e||"")+" "+(r.p||"")+" "+(r.k||"")).toLowerCase().indexOf(q)>-1)})
  .sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:String(b.id)>String(a.id)?1:-1});
 $("tb").innerHTML=L.length?L.map(function(r){
  var tx=r.e||r.k||"";
  return "<tr><td>"+r.d.split("-").reverse().join("/")+"</td><td>"+esc(tx)+(r.p?"<br><small style='color:var(--mu)'>"+esc(r.p)+"</small>":"")+"</td><td><small>"+esc(names[r.u]||"")+"</small></td><td class='n "+(r.t=="m"?"in":"out")+"'>"+(r.t=="m"?"+":"–")+rp(r.j)+"</td><td><button class='x' data-id='"+esc(r.id)+"'>✕</button></td></tr>"}).join(""):"<tr><td colspan='5' class='empty'>Belum ada transaksi</td></tr>";
 var bl={};D.forEach(function(r){bl[r.d.slice(0,7)]=1});
 var cur=$("fb").value;
 $("fb").innerHTML="<option value=''>Semua bulan</option>"+Object.keys(bl).sort().reverse().map(function(b){return "<option value='"+b+"'"+(b==cur?" selected":"")+">"+b+"</option>"}).join("");
}
function resolveNames(){
 if(!usr||!usr.profiles)return;
 var ids=[];D.forEach(function(r){if(r.u&&!names[r.u]&&ids.indexOf(r.u)<0)ids.push(r.u)});
 if(!ids.length)return;
 usr.profiles(ids).then(function(ps){ids.forEach(function(i){names[i]=(ps[i]&&ps[i].name)||"Tim"});render()}).catch(function(){});
}
$("bm").onclick=function(){setTipe("m")};$("bk").onclick=function(){setTipe("k")};
$("fb").onchange=render;$("fs").oninput=render;
$("jml").oninput=function(){var v=this.value.replace(/\D/g,"");this.value=v?Number(v).toLocaleString("id-ID"):""};
$("fm").onsubmit=function(e){e.preventDefault();
 var j=parseInt($("jml").value.replace(/\D/g,""),10);if(!j)return;
 var id="t"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
 var r={id:id,t:tipe,d:$("tgl").value,e:$("ket").value.trim(),j:j,u:uid||""};
 $("ket").value=$("jml").value="";
 if(col){col.doc(id).set(r).catch(function(){alert("Gagal menyimpan. Anda mungkin tidak punya izin menulis (perlu akses Contributor).")})}
 else{D.push(r);lsSave();render()}};
$("tb").onclick=function(e){var id=e.target.getAttribute("data-id");if(!id||!confirm("Hapus transaksi ini?"))return;
 if(col){col.doc(id).delete().catch(function(){alert("Gagal menghapus.")})}
 else{D=D.filter(function(r){return r.id!=id});lsSave();render()}};
$("rst").onclick=function(){if(!confirm("Hapus SEMUA data? Tidak bisa dibatalkan."))return;
 if(col){D.forEach(function(r){col.doc(r.id).delete()})}else{D=[];lsSave();render()}};
$("csv").onclick=function(){
 var s="Tanggal,Jenis,Keterangan,Jumlah\n"+D.slice().sort(function(a,b){return a.d<b.d?-1:1}).map(function(r){
  return [r.d,r.t=="m"?"Masuk":"Keluar",r.e||r.k||"",r.j].map(function(x){return '"'+String(x==null?"":x).replace(/"/g,'""')+'"'}).join(",")}).join("\n");
 var ta=$("ta");ta.value=s;ta.style.display="block";ta.select();
 try{navigator.clipboard.writeText(s)}catch(e){}};
$("tgl").value=new Date().toISOString().slice(0,10);
setTipe("m");lsLoad();render();
(async function(){
 try{
  if(!window.claude||!claude.use)return;
  var db=await claude.use("db");
  usr=await claude.use("user");
  if(usr){try{uid=await usr.id()}catch(e){}
   try{if(await usr.isOwner())$("rst").style.display="inline-block"}catch(e){}}
  if(!db)return;
  col=db.collection("tx");
  col.onSnapshot(function(snap){
   D=snap.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x});
   render();resolveNames();
  },function(){$("sd").textContent="Koneksi data terputus. Muat ulang halaman.";col=null});
 }catch(e){}
})();
</script>
</body>
</html>
